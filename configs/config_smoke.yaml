data_dir: ./data/docbank/DocBank_500K_txt
output_dir: ./outputs
model_name: distilbert-base-uncased
max_length: 256
train_samples: 50
val_samples: 10
test_samples: 10
batch_size: 2
epochs: 1
learning_rate: 3e-4
seed: 42
freeze_backbone: true
unfreeze_last_n_layers: 0
ignored_labels:
  - figure
  - table
  - equation
  - caption
  - figure_caption
  - table_caption
